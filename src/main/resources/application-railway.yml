# Spring Boot profile activated when SPRING_PROFILES_ACTIVE=railway
#
# Required Railway Variables (set in student-vault service → Variables tab):
#   SPRING_PROFILES_ACTIVE = railway
#   PGHOST     = ${{Postgres.PGHOST}}
#   PGPORT     = ${{Postgres.PGPORT}}
#   PGDATABASE = ${{Postgres.PGDATABASE}}
#   PGUSER     = ${{Postgres.PGUSER}}
#   PGPASSWORD = ${{Postgres.PGPASSWORD}}
#
# Interview talking point:
#   "I use separate Spring profiles for local Docker and Railway production,
#    so environment-specific config stays out of the codebase."

spring:
  datasource:
    # sslmode=prefer works for both Railway internal (no SSL) and external (SSL) connections.
    # sslmode=require caused SSL handshake timeouts on Railway's private network.
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=prefer
    username: ${PGUSER}
    password: ${PGPASSWORD}
    hikari:
      maximum-pool-size: 5          # Railway free tier has connection limits
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      initialization-fail-timeout: 60000   # Wait up to 60s for DB to be ready

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate        # Flyway owns schema — Hibernate only validates

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}            # Railway dynamically assigns PORT

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always      # Railway health check needs this to return full status

logging:
  level:
    com.studentvault: INFO
    org.hibernate.SQL: WARN
