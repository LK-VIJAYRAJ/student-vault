# Spring Boot profile activated when SPRING_PROFILES_ACTIVE=koyeb
#
# Required Koyeb Environment Variables (set in Koyeb dashboard → Service → Environment):
#   SPRING_PROFILES_ACTIVE = koyeb
#   DATABASE_URL            = postgres://user:password@host:port/dbname
#                             (copy directly from Neon.tech or Koyeb PostgreSQL dashboard)
#
# Optional (auto-detected by Koyeb):
#   PORT                   = injected automatically by Koyeb
#
# Interview talking point:
#   "I use separate Spring profiles for local Docker, Railway, and Koyeb production,
#    so environment-specific config stays out of the codebase."

spring:
  datasource:
    # Koyeb / Neon.tech provide a postgres:// URI — Spring Boot converts it to jdbc:postgresql://
    # We explicitly build the JDBC URL to ensure SSL is handled correctly for Neon.tech
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
    username: ${PGUSER}
    password: ${PGPASSWORD}
    hikari:
      maximum-pool-size: 5          # Free tier has connection limits
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      initialization-fail-timeout: 60000   # Wait up to 60s for DB to be ready
      keepalive-time: 60000                 # Keep connections alive (important for Neon serverless)

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate            # Flyway owns schema — Hibernate only validates

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}                # Koyeb dynamically assigns PORT

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always          # Koyeb health check needs full status

logging:
  level:
    com.studentvault: INFO
    org.hibernate.SQL: WARN
